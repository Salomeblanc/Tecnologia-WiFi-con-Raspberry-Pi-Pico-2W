<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NRF24L01 por WiFi</title>
<style>
:root{--green:#28a745;--success:#198754;--danger:#dc3545;--bg:#f7f7f7;--text:#222}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
header{background:var(--green);color:white;text-align:center;padding:1rem .75rem}h1{margin:0;font-size:1.3rem}
main{padding:1rem;display:flex;justify-content:center}
.card{background:white;border:1px solid #e6e6e6;border-radius:14px;padding:1.2rem;max-width:560px;width:100%;box-shadow:0 2px 10px #0000000f}
h2{font-size:1.05rem;margin:1rem 0 .6rem}h2:first-child{margin-top:0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:.85rem;color:#555;gap:.25rem;flex:1;min-width:130px}
input,select{font-size:1rem;padding:.55rem;border:1px solid #ccc;border-radius:8px;width:100%}
button{border:0;border-radius:10px;padding:.65rem 1.1rem;font-size:1rem;font-weight:700;color:white;background:var(--success);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.hint{font-size:.9rem;color:#555;margin:.5rem 0}.warn{color:#b45309}
#log{border:1px solid #e6e6e6;border-radius:10px;height:230px;overflow-y:auto;padding:.5rem;margin-top:.7rem;background:#fcfcfc;font-size:.95rem}
#log div{padding:.2rem 0;border-bottom:1px solid #f0f0f0}.tag{font-weight:700;margin-right:.4rem}
.tx .tag{color:#0b5ed7}.rx .tag{color:var(--success)}.err .tag{color:var(--danger)}.sys{color:#666}
.message{min-height:1.4em;font-size:.9rem;color:#555;margin:.6rem 0 0}.message.error{color:#b42318}
footer{text-align:center;padding:.9rem;color:#666;font-size:.9rem}
</style>
</head>
<body>
<header><h1>NRF24L01 por WiFi · Nodo <span id="role">-</span></h1></header>
<main><div class="card">
<h2>Configuración del radio</h2>
<div class="row">
<label>Canal NRF (0 a 125)<input id="ch" type="number" min="0" max="125" step="1"></label>
<label>Potencia<select id="pwr"><option value="0">-18 dBm</option><option value="1">-12 dBm</option><option value="2">-6 dBm</option><option value="3">0 dBm</option></select></label>
<button id="apply" disabled>Aplicar</button>
</div>
<p class="hint" id="freq">Frecuencia: -</p>
<p class="hint">Los dos nodos deben usar el mismo canal NRF para comunicarse.</p>
<h2>Mensajes por NRF</h2>
<div class="row">
<label style="flex:3;min-width:180px">Mensaje (máx. 32 bytes)<input id="msg" maxlength="32" autocomplete="off"></label>
<button id="send" disabled>Enviar</button>
</div>
<div id="log" aria-live="polite"></div>
<p id="message" class="message">Conectando con la Pico…</p>
</div></main>
<footer>&copy; Ingeniería en Telecomunicaciones UMNG</footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
const LABEL = {tx:'Enviado', rx:'Recibido', err:'No entregado', sys:'Sistema'};
let busy = false, last = 0, inited = false, wifiCh = 1, timer = null;

function setMessage(text, error = false) { $('message').textContent = text; $('message').className = 'message' + (error ? ' error' : ''); }
async function api(path, method = 'GET') {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 6000);
  try {
    const response = await fetch(path, {method, cache: 'no-store', signal: controller.signal});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return await response.json();
  } finally { clearTimeout(timeout); }
}
function showFreq() {
  const ch = Number($('ch').value), mhz = 2400 + ch, wifiMHz = 2407 + 5 * wifiCh;
  let text = 'Frecuencia NRF: ' + mhz + ' MHz';
  const close = Math.abs(mhz - wifiMHz) <= 11;
  if (close) text += ' · ⚠ cae dentro del canal WiFi ' + wifiCh + ' de esta Pico (puede interferir)';
  $('freq').textContent = text;
  $('freq').className = 'hint' + (close ? ' warn' : '');
}
function render(data) {
  $('role').textContent = data.role;
  wifiCh = data.wifi_ch;
  if (!inited) { $('ch').value = data.ch; $('pwr').value = data.pwr; inited = true; }
  const lastSeq = data.msgs.length ? data.msgs[data.msgs.length - 1][0] : 0;
  if (lastSeq < last) { $('log').textContent = ''; last = 0; }   // la Pico se reinició
  for (const [n, kind, text] of data.msgs) {
    if (n <= last) continue;
    const line = document.createElement('div'); line.className = kind;
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = LABEL[kind] || kind;
    line.append(tag, document.createTextNode(text)); $('log').append(line);
    last = n;
  }
  $('log').scrollTop = $('log').scrollHeight;
  showFreq();
}
async function refresh(path = '/status', method = 'GET') {
  if (busy) return null;
  busy = true; clearTimeout(timer);
  $('apply').disabled = $('send').disabled = true;
  let result = null;
  try {
    result = await api(path, method);
    if (result.msgs) { render(result); setMessage('Conectado.'); }
  } catch (error) {
    setMessage('Sin respuesta de la Pico. Comprueba la conexión WiFi; se reintentará.', true);
  } finally {
    busy = false;
    $('apply').disabled = $('send').disabled = false;
    timer = setTimeout(() => refresh(), 1000);
  }
  return result;
}
$('ch').addEventListener('input', showFreq);
$('apply').addEventListener('click', async () => {
  const ch = Number($('ch').value);
  if (!Number.isInteger(ch) || ch < 0 || ch > 125) { setMessage('El canal debe ser un entero de 0 a 125.', true); return; }
  await refresh('/cfg?ch=' + ch + '&pwr=' + $('pwr').value, 'POST');
});
$('send').addEventListener('click', async () => {
  const text = $('msg').value.trim();
  if (!text) { setMessage('Escribe un mensaje.', true); return; }
  const result = await refresh('/send?m=' + encodeURIComponent(text), 'POST');
  if (result && result.info) setMessage(result.info, !result.ok);
  if (result && result.ok) $('msg').value = '';
});
$('msg').addEventListener('keydown', event => { if (event.key === 'Enter') $('send').click(); });
refresh();
</script>
</body>
</html>
